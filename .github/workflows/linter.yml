name: Code Quality & Linting

on: [push, pull_request]

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  lint:
    name: Run super-linter
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: main
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VALIDATE_ALL_CODEBASE: false
      VALIDATE_MARKDOWN: false
      VALIDATE_JAVASCRIPT_ES: false
      VALIDATE_JAVASCRIPT_STANDARD: false
      VALIDATE_JAVASCRIPT_PREFERRED: false
      VALIDATE_JAVASCRIPT_REACT: false
      VALIDATE_TYPESCRIPT_ES: false
      VALIDATE_TYPESCRIPT_STANDARD: false
      VALIDATE_TYPESCRIPT_PREFERRED: false
      VALIDATE_TYPESCRIPT_REACT: false
      VALIDATE_GO: false
      # Terraform/security policy is enforced by the dedicated Terraform
      # security workflow. Keep this broad linter focused on formatting,
      # workflow syntax, and secret scanning rather than duplicating that gate.
      VALIDATE_CHECKOV: false
      # Duplicate-code detection is useful as a trend signal, but a zero-percent
      # threshold on small test fixtures made this workflow fail independently
      # of the repository's functional and security gates.
      VALIDATE_JSCPD: false

    steps:
      - name: Checkout code with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run super-linter
        uses: github/super-linter/slim@v7
